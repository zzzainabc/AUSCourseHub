<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Courses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="CoursesMain.css">
</head>

<body>
  <button id="menuToggle" class="menu-toggle">☰</button>

  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CourseHub</span>
      <button id="closeMenu" class="close-btn">✕</button>
    </div>

    <nav class="sidebar-nav">
      <a href="UsersServlet" class="nav-item-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="#" class="nav-item-custom active me-3"><i class="bi bi-journal-bookmark-fill"></i> My classes</a>
      <a href="ScheduleServlet" class="nav-item-custom"><i class="bi bi-clock"></i> Schedule</a>
      <a href="SidebarServlet?page=flowchart" class="nav-item-custom"><i class="bi bi-diagram-2"></i> FlowChart</a>
      <a href="SidebarServlet?page=messages" class="nav-item-custom"><i class="bi bi-chat-dots"></i> Messages</a>
    </nav>
  </div>

  <header class="topbar">
    <div class="uni-name">American University of Sharjah</div>
  </header>

  <main class="container">
    <section class="header-row">
      <div>
        <h1>My Courses</h1>
        <p>Manage your academic load.</p>
      </div>

      <button class="add-btn" onclick="openForm()">+ Add Course</button>
    </section>

    <section class="empty-box" id="emptyBox">
      <div class="empty-content">
        <div class="circle">📖</div>

        <h2>No courses yet</h2>

        <p>
          Get started by adding your first course to track<br>
          notes, assignments, and grades.
        </p>

        <button class="secondary-btn" onclick="openForm()">
          + Add Your First Course
        </button>
      </div>
    </section>

    <div class="row g-4" id="coursesList"></div>
  </main>

  <div class="form-page" id="myForm">
    <div class="form-card">
      <h2 class="form-title">Add New Course</h2>

      <form id="courseForm" onsubmit="addCourse(event)">
  <label>Course Code</label>
  <input type="text" id="courseCode" name="courseCode" required>

  <label>Course Name</label>
  <input type="text" id="courseName" name="courseName" required>

  <label>Semester</label>
  <input type="text" id="semester" name="semester" required>

  <label>Instructor</label>
  <input type="text" id="instructor" name="instructor" required>

  <label>Instructor Email</label>
  <input type="email" id="instructorEmail" name="instructorEmail" required>

  <div class="form-buttons">
    <button type="button" class="cancel-btn" onclick="closeForm()">Cancel</button>
    <button type="submit" class="add-btn form-save-btn">Save Course</button>
  </div>
</form>
    </div>
  </div>

  <script src="CoursesMain.js"></script>
</body>
</html>
