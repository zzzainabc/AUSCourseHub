<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AUS Academic Workspace - Login & Sign Up</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
  <link rel="stylesheet" href="login.css">
  <style>
    /* Adding a smooth transition for the hidden name field */
    .hidden-field {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container login-wrapper">
    <div class="login-card">
      <h1 class="login-title" id="formTitle">AUS Course Hub</h1>
      <p class="login-subtitle" id="formSubtitle">Sign in to access your course workspace</p>

      <form id="authForm" action="UsersServlet" method="POST">
        <input type="hidden" id="authAction" name="action" value="login">

        <div class="mb-3 hidden-field" id="nameField">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your full name">
        </div>

        <div class="mb-3 hidden-field" id="idField">
          <label for="id" class="form-label">AUS ID</label>
          <input type="text" class="form-control" id="id" name="id" placeholder="Enter your AUS ID">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">AUS Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter your AUS email" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-login" id="submitbutton">Login</button>
        </div>
      </form>

      <div class="mt-4 text-center">
        <p class="text-muted small">
          <span id="toggleText">Don't have an account?</span> 
          <a href="javascript:void(0)" onclick="toggleAuthMode()" id="toggleLink" class="text-decoration-none">Sign Up</a>
        </p>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
