<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Schedule</title>
  <script>
  	const savedClasses = []; // This is populated by your ScheduleServlet
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="schedule.css"></head>
<body>

  <button id="menuToggle" class="menu-toggle">☰</button>

  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CourseHub</span>
      <button id="closeMenu" class="close-btn">✕</button>
    </div>

    <nav class="sidebar-nav">
      <a href="UsersServlet" class="nav-item-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="SidebarServlet?page=CoursesMain" class="nav-item-custom"><i class="bi bi-journal-bookmark-fill"></i> My classes</a>
      <a href="#" class="nav-item-custom active"><i class="bi bi-clock"></i> Schedule</a>
      <a href="SidebarServlet?page=flowchart" class="nav-item-custom"><i class="bi bi-diagram-2"></i> FlowChart</a>
      <a href="SidebarServlet?page=messages" class="nav-item-custom"><i class="bi bi-chat-dots"></i> Messages</a>
    </nav>
  </div>

  <header class="topbar">
    <div>
      <h1>My Schedule</h1>
      <p>Build and manage your weekly class timetable.</p>
    </div>
    <button id="openFormBtn" class="add-class-btn">+ Add Class</button>
  </header>

  <main class="page-content">
    <section class="schedule-card">
      <div class="schedule-board">
        <div class="schedule-header-row">
          <div class="time-header"></div>
          <div class="day-header">Monday</div>
          <div class="day-header">Tuesday</div>
          <div class="day-header">Wednesday</div>
          <div class="day-header">Thursday</div>
        </div>

        <div class="schedule-grid" id="scheduleGrid"></div>
      </div>
    </section>
  </main>

  <div class="form-page" id="classFormPopup"> 
    <div class="form-card">
      <h2 class="form-title">Add Course to Schedule</h2>

      <form id="classForm" action="ScheduleServlet" method="POST">
		  <label for="courseType" class="form-label">Type</label>
		  <select id="courseType" name="courseType" class="form-control" required>
		    <option value="">Select type</option>
		    <option value="lecture">Lecture</option>
		    <option value="recitation">Recitation</option>
		    <option value="lab110">Lab (1h 50m)</option>
		    <option value="lab250">Lab (2h 50m)</option>
		</select>
		
		  <label for="courseName" class="form-label">Course Name</label>
		  <input type="text" id="courseName" name="courseName" class="form-control" required>
		
		  <label for="courseCode" class="form-label">Course Code</label>
		  <input type="text" id="courseCode" name="courseCode" class="form-control" required>
		
		  <label class="form-label">Days</label>
		  <div class="days-group">
		    <label><input type="checkbox" name="days" value="Monday"> Monday</label>
		    <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
		    <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
		    <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
		  </div>
		
		  <label for="startTime" class="form-label">Start Time</label>
		  <select id="startTime" name="startTime" class="form-control" required>
		    <option value="">Select start time</option>
		    <option value="8:00">8:00am</option>
		    <option value="9:30">9:30am</option>
		    <option value="11:00">11:00am</option>
		    <option value="12:30">12:30pm</option>
		    <option value="14:00">2:00pm</option>
		    <option value="15:30">3:30pm</option>
		    <option value="17:00">5:00pm</option>
		    <option value="18:30">6:30pm</option>
		  </select>
		
		  <label for="room" class="form-label">Room</label>
		  <input type="text" id="room" name="room" class="form-control" required>
		
		  <div class="form-actions">
		    <button type="button" class="secondary-btn" id="cancelFormBtn">Cancel</button>
		    <button type="submit" class="add-class-btn">Save Class</button>
		  </div>
		</form>
    </div>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
